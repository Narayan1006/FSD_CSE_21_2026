<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Object Javascript</title>
</head>
<body>
    <Script>
        const student={
            Name:"Narayan",
            Age:20,
            College:"ABES", 
            fees:132000
        }
        for(let key in student){
            document.write(student[key]+"<br>");

        }
    </script>
</body>
</html>
