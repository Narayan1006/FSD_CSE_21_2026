<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr=["maruti","Honda","Toyota","Hyundai"];
        text="";
        for(let i=0;i<arr.length;i++){
            if(arr[i]!="Honda"){
                text+=arr[i]+"<br>";
            }
        }
        document.write(text);
    </script>
    
</body>
</html>
