
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>

    <link rel="stylesheet" href="./style.css">
</head>
<script src="./script.js"></script>
<body>

    <div id="Card">

        <!-- Header -->
        <div class="container">
            <img src="./Assets/image.png" alt="bus" id="bus-image">

            <h1>Bus Booking System</h1>
        </div>


        <!-- Book Ticket Heading -->
        <div id="book-ticket">
            <h2>Book Your Bus Ticket</h2>
        </div>


        <!-- Booking Form -->
        <div class="form-container">

            <label for="name">Name:</label>
            <input 
                type="text" 
                id="name" 
                placeholder="Enter your name"
            >

            <br><br>


            <label for="age">Age:</label>
            <input 
                type="text" 
                id="age" 
                placeholder="Enter your age"
            >

            <br><br>


            <label for="aadhar">Aadhar No.:</label>
            <input 
                type="text" 
                id="aadhar" 
                placeholder="Enter your Aadhar number"
            >

            <br><br>


            <label for="City">Select City:</label>

            <select id="City">
                <option value="City1">City 1</option>
                <option value="City2">City 2</option>
                <option value="City3">City 3</option>
            </select>

            <br><br>


            <label for="date">Date:</label>
            <input 
                type="date" 
                id="date"
            >

        </div>
        <div id ="businfo">
            <h1>Bus Information</h1>
        </div>
        <div id="bus-information">

    <input type="radio" id="acbus" name="bus" value="AC">
    <label for="acbus">AC Bus :-> ₹2000</label>

    <br><br>

    <input type="radio" id="nonacbus" name="bus" value="NonAC">
    <label for="nonacbus">Non AC Bus :-> ₹1000</label>

    <br><br>

    <label for="seat">Select Your Seat:</label>

    <select id="seat">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>

</div>

<div class="button-container">
    <button type="button" onclick="bookTicket()">
        Book Now
    </button>
</div>

</body>
</html>
